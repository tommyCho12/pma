<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layouts/main}" xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity5">

<head th:replace="layouts :: header"></head>

<body class="font-sans bg-surface-900 min-h-screen">
    <nav th:replace="layouts :: navbar"></nav>

    <div layout:fragment="content">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 pb-24">

            <!-- Loading Indicator -->
            <div id="loading" class="flex flex-col items-center justify-center py-20">
                <div class="w-12 h-12 border-4 border-brand-300 border-t-brand-600 rounded-full animate-spin"></div>
                <p class="mt-4 text-slate-400 font-medium">Loading document...</p>
            </div>

            <!-- Error Message -->
            <div id="errorMessage"
                class="hidden bg-red-500/20 border border-red-500/50 text-red-400 rounded-xl p-4 mb-6"></div>

            <!-- Document Container -->
            <div id="documentContainer" style="display: none;">

                <!-- Actions -->
                <div class="flex flex-wrap items-center gap-3 mb-6">
                    <a href="/documents"
                        class="inline-flex items-center gap-2 px-4 py-2 bg-surface-800 hover:bg-surface-700 text-slate-300 font-medium rounded-xl border border-surface-700 transition-all duration-200">
                        <i class="bi bi-arrow-left"></i> Back to Documents
                    </a>
                    <div class="flex-1"></div>
                    <a sec:authorize="isAuthenticated()" id="updateButton" href="#"
                        class="inline-flex items-center gap-2 px-4 py-2 bg-brand-500 hover:bg-brand-600 text-white font-medium rounded-xl shadow-lg transition-all duration-200 hover:scale-105">
                        <i class="bi bi-pencil"></i> Edit Document
                    </a>
                    <button sec:authorize="hasAuthority('PERMISSION_REVIEWER')" id="reviewButton"
                        class="inline-flex items-center gap-2 px-4 py-2 bg-emerald-500 hover:bg-emerald-600 text-white font-medium rounded-xl shadow-lg transition-all duration-200 hover:scale-105">
                        <i class="bi bi-check-circle"></i> Mark as Reviewed
                    </button>
                    <button onclick="window.print()"
                        class="inline-flex items-center gap-2 px-4 py-2 bg-surface-800 hover:bg-surface-700 text-slate-300 font-medium rounded-xl border border-surface-700 transition-all duration-200">
                        <i class="bi bi-printer"></i> Print
                    </button>
                    <a sec:authorize="isAuthenticated()" id="deleteButton" href="#"
                        class="inline-flex items-center gap-2 px-4 py-2 bg-red-500 hover:bg-red-600 text-white font-medium rounded-xl shadow-lg transition-all duration-200 hover:scale-105">
                        <i class="bi bi-trash"></i> Delete
                    </a>
                </div>

                <!-- Document Header -->
                <div class="bg-brand-600 rounded-2xl p-8 mb-8 shadow-xl">
                    <h1 id="documentTitle" class="text-3xl md:text-4xl font-bold text-white mb-3">Document Title</h1>
                    <div class="inline-flex items-center gap-2 px-3 py-1.5 bg-white/10 rounded-lg">
                        <span class="text-white/70 text-sm">Document ID:</span>
                        <code id="documentId" class="text-white font-mono text-sm">DOC-001</code>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <!-- Main Content -->
                    <div class="lg:col-span-2">
                        <div class="bg-surface-800 rounded-2xl shadow-lg border border-surface-700 overflow-hidden">
                            <div class="px-6 py-4 bg-surface-900 border-b border-surface-700">
                                <h2 class="text-lg font-semibold text-white flex items-center gap-2">
                                    <i class="bi bi-file-text text-brand-400"></i> Content
                                </h2>
                            </div>
                            <div id="documentContent" class="p-6 prose prose-invert max-w-none">Document content goes
                                here...</div>
                        </div>
                    </div>

                    <!-- Sidebar -->
                    <div class="lg:col-span-1">
                        <div
                            class="bg-surface-800 rounded-2xl shadow-lg border border-surface-700 overflow-hidden sticky top-6">
                            <div class="px-6 py-4 bg-brand-600">
                                <h2 class="text-lg font-semibold text-white flex items-center gap-2">
                                    <i class="bi bi-info-circle"></i> Document Information
                                </h2>
                            </div>
                            <div class="p-6 space-y-4">
                                <div class="flex flex-col gap-1">
                                    <span class="text-xs font-semibold uppercase tracking-wider text-slate-500">📝
                                        Title</span>
                                    <span id="documentTitleMeta" class="text-slate-200 font-medium">Title</span>
                                </div>
                                <div class="flex flex-col gap-1 pb-4 border-b border-surface-700">
                                    <span class="text-xs font-semibold uppercase tracking-wider text-slate-500">👤
                                        Author</span>
                                    <span id="documentAuthor" class="text-slate-200 font-medium">Unknown</span>
                                </div>
                                <div class="flex flex-col gap-1">
                                    <span class="text-xs font-semibold uppercase tracking-wider text-slate-500">📅
                                        Created</span>
                                    <span id="documentCreated" class="text-slate-200 font-medium">-</span>
                                </div>
                                <div class="flex flex-col gap-1 pb-4 border-b border-surface-700">
                                    <span class="text-xs font-semibold uppercase tracking-wider text-slate-500">🔄 Last
                                        Updated</span>
                                    <span id="documentUpdated" class="text-slate-200 font-medium">-</span>
                                </div>
                                <div id="documentTagsSection" style="display: none;"
                                    class="flex flex-col gap-2 pb-4 border-b border-surface-700">
                                    <span class="text-xs font-semibold uppercase tracking-wider text-slate-500">🏷️
                                        Tags</span>
                                    <div id="documentTagsDisplay" class="flex flex-wrap gap-1.5"></div>
                                </div>
                                <div class="flex flex-col gap-1">
                                    <span class="text-xs font-semibold uppercase tracking-wider text-slate-500">✅ Review
                                        Status</span>
                                    <span id="documentReviewer" class="text-slate-200 font-medium"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div th:replace="layouts :: footer"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        #documentContent h1,
        #documentContent h2,
        #documentContent h3 {
            color: white;
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
        }

        #documentContent h1 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        #documentContent h2 {
            font-size: 1.25rem;
            font-weight: 600;
        }

        #documentContent h3 {
            font-size: 1.125rem;
            font-weight: 600;
            color: #e2e8f0;
        }

        #documentContent p {
            color: #94a3b8;
            line-height: 1.625;
            margin-bottom: 1rem;
        }

        #documentContent ul,
        #documentContent ol {
            color: #94a3b8;
            padding-left: 1.5rem;
            margin-bottom: 1rem;
        }

        #documentContent ul {
            list-style-type: disc;
        }

        #documentContent ol {
            list-style-type: decimal;
        }

        #documentContent code {
            background-color: #1e293b;
            color: #60a5fa;
            padding: 0.125rem 0.375rem;
            border-radius: 0.25rem;
            font-size: 0.875rem;
        }

        #documentContent pre {
            background-color: #0f172a;
            color: #e2e8f0;
            padding: 1rem;
            border-radius: 0.75rem;
            overflow-x: auto;
            margin-bottom: 1rem;
        }

        #documentContent pre code {
            background-color: transparent;
            color: inherit;
            padding: 0;
        }

        #documentContent blockquote {
            border-left: 4px solid #3b82f6;
            background-color: rgba(59, 130, 246, 0.1);
            padding: 0.5rem 1rem;
            margin: 1rem 0;
            color: #94a3b8;
            font-style: italic;
        }

        #documentContent a {
            color: #60a5fa;
            text-decoration: underline;
        }

        #documentContent table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1rem;
        }

        #documentContent th,
        #documentContent td {
            border: 1px solid #334155;
            padding: 0.5rem 1rem;
            text-align: left;
        }

        #documentContent th {
            background-color: #1e293b;
            font-weight: 600;
            color: white;
        }

        #documentContent td {
            color: #94a3b8;
        }

        .tag-badge-view {
            display: inline-block;
            padding: 0.25rem 0.625rem;
            background: #3b82f6;
            color: white;
            font-size: 0.75rem;
            font-weight: 500;
            border-radius: 9999px;
        }
    </style>
    <script th:src="@{/js/documentView.js}"></script>
</body>

</html>
