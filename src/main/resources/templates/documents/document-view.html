<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layouts/main}" xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity5">

<head th:replace="layouts :: header">
</head>

<body class="font-sans bg-gradient-to-br from-slate-50 to-slate-100 min-h-screen">
    <nav th:replace="layouts :: navbar"></nav>

    <div layout:fragment="content">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 pb-24">

            <!-- Loading Indicator -->
            <div id="loading" class="flex flex-col items-center justify-center py-20">
                <div class="w-12 h-12 border-4 border-primary-200 border-t-primary-600 rounded-full animate-spin"></div>
                <p class="mt-4 text-slate-500 font-medium">Loading document...</p>
            </div>

            <!-- Error Message -->
            <div id="errorMessage" class="hidden bg-red-50 border border-red-200 text-red-700 rounded-xl p-4 mb-6">
            </div>

            <!-- Document Container (hidden until loaded) -->
            <div id="documentContainer" style="display: none;">

                <!-- Back Button & Actions -->
                <div class="flex flex-wrap items-center gap-3 mb-6">
                    <a href="/documents"
                        class="inline-flex items-center gap-2 px-4 py-2 bg-white hover:bg-slate-50 text-slate-700 font-medium rounded-xl border border-slate-200 shadow-sm transition-all duration-200 hover:shadow">
                        <i class="bi bi-arrow-left"></i>
                        Back to Documents
                    </a>

                    <div class="flex-1"></div>

                    <a sec:authorize="isAuthenticated()" id="updateButton" href="#"
                        class="inline-flex items-center gap-2 px-4 py-2 bg-gradient-to-r from-primary-500 to-primary-600 hover:from-primary-600 hover:to-primary-700 text-white font-medium rounded-xl shadow-lg shadow-primary-500/25 transition-all duration-200 hover:shadow-xl hover:scale-105">
                        <i class="bi bi-pencil"></i>
                        Edit Document
                    </a>

                    <button sec:authorize="hasAuthority('PERMISSION_REVIEWER')" id="reviewButton"
                        class="inline-flex items-center gap-2 px-4 py-2 bg-gradient-to-r from-emerald-500 to-emerald-600 hover:from-emerald-600 hover:to-emerald-700 text-white font-medium rounded-xl shadow-lg shadow-emerald-500/25 transition-all duration-200 hover:shadow-xl hover:scale-105">
                        <i class="bi bi-check-circle"></i>
                        Mark as Reviewed
                    </button>

                    <button onclick="window.print()"
                        class="inline-flex items-center gap-2 px-4 py-2 bg-white hover:bg-slate-50 text-slate-700 font-medium rounded-xl border border-slate-200 shadow-sm transition-all duration-200 hover:shadow">
                        <i class="bi bi-printer"></i>
                        Print
                    </button>

                    <a sec:authorize="isAuthenticated()" id="deleteButton" href="#"
                        class="inline-flex items-center gap-2 px-4 py-2 bg-gradient-to-r from-red-500 to-red-600 hover:from-red-600 hover:to-red-700 text-white font-medium rounded-xl shadow-lg shadow-red-500/25 transition-all duration-200 hover:shadow-xl hover:scale-105">
                        <i class="bi bi-trash"></i>
                        Delete
                    </a>
                </div>

                <!-- Document Header -->
                <div
                    class="bg-gradient-to-br from-primary-600 via-primary-700 to-accent-purple rounded-2xl p-8 mb-8 shadow-xl shadow-primary-500/20">
                    <div class="flex flex-col md:flex-row md:items-start justify-between gap-4">
                        <div>
                            <h1 id="documentTitle" class="text-3xl md:text-4xl font-bold text-white mb-3">Document Title
                            </h1>
                            <div
                                class="inline-flex items-center gap-2 px-3 py-1.5 bg-white/10 backdrop-blur-sm rounded-lg">
                                <span class="text-white/70 text-sm">Document ID:</span>
                                <code id="documentId" class="text-white font-mono text-sm">DOC-001</code>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <!-- Main Content Area -->
                    <div class="lg:col-span-2">
                        <div
                            class="bg-white rounded-2xl shadow-lg shadow-slate-200/50 border border-slate-100 overflow-hidden">
                            <div
                                class="px-6 py-4 bg-gradient-to-r from-slate-50 to-slate-100 border-b border-slate-200">
                                <h2 class="text-lg font-semibold text-slate-700 flex items-center gap-2">
                                    <i class="bi bi-file-text text-primary-500"></i>
                                    Content
                                </h2>
                            </div>
                            <div id="documentContent" class="p-6 prose prose-slate prose-lg max-w-none">
                                Document content goes here...
                            </div>
                        </div>
                    </div>

                    <!-- Sidebar with Metadata -->
                    <div class="lg:col-span-1">
                        <div
                            class="bg-white/70 backdrop-blur-lg rounded-2xl shadow-lg shadow-slate-200/50 border border-white/50 overflow-hidden sticky top-6">
                            <div class="px-6 py-4 bg-gradient-to-r from-primary-500 to-accent-purple">
                                <h2 class="text-lg font-semibold text-white flex items-center gap-2">
                                    <i class="bi bi-info-circle"></i>
                                    Document Information
                                </h2>
                            </div>
                            <div class="p-6 space-y-4">
                                <!-- Title -->
                                <div class="flex flex-col gap-1">
                                    <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">📝
                                        Title</span>
                                    <span id="documentTitleMeta" class="text-slate-700 font-medium">Title</span>
                                </div>

                                <!-- Author -->
                                <div class="flex flex-col gap-1 pb-4 border-b border-slate-100">
                                    <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">👤
                                        Author</span>
                                    <span id="documentAuthor" class="text-slate-700 font-medium">Unknown</span>
                                </div>

                                <!-- Created -->
                                <div class="flex flex-col gap-1">
                                    <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">📅
                                        Created</span>
                                    <span id="documentCreated" class="text-slate-700 font-medium">-</span>
                                </div>

                                <!-- Last Updated -->
                                <div class="flex flex-col gap-1 pb-4 border-b border-slate-100">
                                    <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">🔄 Last
                                        Updated</span>
                                    <span id="documentUpdated" class="text-slate-700 font-medium">-</span>
                                </div>

                                <!-- Tags Section -->
                                <div id="documentTagsSection" style="display: none;"
                                    class="flex flex-col gap-2 pb-4 border-b border-slate-100">
                                    <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">🏷️
                                        Tags</span>
                                    <div id="documentTagsDisplay" class="flex flex-wrap gap-1.5">
                                        <!-- Tags will be displayed here -->
                                    </div>
                                </div>

                                <!-- Review Status -->
                                <div class="flex flex-col gap-1">
                                    <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">✅ Review
                                        Status</span>
                                    <span id="documentReviewer" class="text-slate-700 font-medium"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <div th:replace="layouts :: footer"></div>
    </div>

    <!-- Marked.js for Markdown Rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Custom Document View Styles -->
    <style>
        /* Prose overrides for markdown content */
        #documentContent h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1e293b;
            margin-top: 1.5rem;
            margin-bottom: 1rem;
        }

        #documentContent h2 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #1e293b;
            margin-top: 1.25rem;
            margin-bottom: 0.75rem;
        }

        #documentContent h3 {
            font-size: 1.125rem;
            font-weight: 600;
            color: #334155;
            margin-top: 1rem;
            margin-bottom: 0.5rem;
        }

        #documentContent p {
            color: #475569;
            line-height: 1.625;
            margin-bottom: 1rem;
        }

        #documentContent ul,
        #documentContent ol {
            color: #475569;
            padding-left: 1.5rem;
            margin-bottom: 1rem;
        }

        #documentContent ul {
            list-style-type: disc;
        }

        #documentContent ol {
            list-style-type: decimal;
        }

        #documentContent li {
            margin-bottom: 0.25rem;
        }

        #documentContent code {
            background-color: #f1f5f9;
            color: #4f46e5;
            padding: 0.125rem 0.375rem;
            border-radius: 0.25rem;
            font-size: 0.875rem;
            font-family: 'Courier New', monospace;
        }

        #documentContent pre {
            background-color: #1e293b;
            color: #f1f5f9;
            padding: 1rem;
            border-radius: 0.75rem;
            overflow-x: auto;
            margin-bottom: 1rem;
        }

        #documentContent pre code {
            background-color: transparent;
            color: inherit;
            padding: 0;
        }

        #documentContent blockquote {
            border-left: 4px solid #a5b4fc;
            background-color: #eef2ff;
            padding-left: 1rem;
            padding-top: 0.5rem;
            padding-bottom: 0.5rem;
            margin-top: 1rem;
            margin-bottom: 1rem;
            color: #475569;
            font-style: italic;
        }

        #documentContent a {
            color: #4f46e5;
            text-decoration: underline;
        }

        #documentContent a:hover {
            color: #4338ca;
        }

        #documentContent table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1rem;
        }

        #documentContent th,
        #documentContent td {
            border: 1px solid #e2e8f0;
            padding: 0.5rem 1rem;
            text-align: left;
        }

        #documentContent th {
            background-color: #f1f5f9;
            font-weight: 600;
        }

        /* Tag badges */
        .tag-badge-view {
            display: inline-block;
            padding: 0.25rem 0.625rem;
            background: linear-gradient(135deg, #6366f1, #764ba2);
            color: white;
            font-size: 0.75rem;
            font-weight: 500;
            border-radius: 9999px;
        }

        /* Print styles */
        @media print {

            .action-buttons,
            nav,
            footer,
            .sticky {
                display: none !important;
            }

            .lg\:col-span-2 {
                grid-column: span 3 !important;
            }

            .bg-gradient-to-br {
                background: #4f46e5 !important;
            }
        }
    </style>

    <!-- Include document view handler -->
    <script th:src="@{/js/documentView.js}"></script>

</body>

</html>
