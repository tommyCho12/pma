<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity5">

<head th:replace="layouts :: header">
</head>

<body class="font-sans bg-surface-900 min-h-screen">

    <nav th:replace="layouts :: navbar"></nav>

    <!-- Main Content -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 pb-24">

        <!-- Page Header -->
        <div class="mb-8">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                <div>
                    <h1 class="text-3xl font-bold text-white">Documents</h1>
                    <p class="mt-1 text-slate-400">Manage and organize your documents</p>
                </div>
                <a sec:authorize="isAuthenticated()" th:href="@{/documents/new}"
                    class="inline-flex items-center gap-2 px-5 py-2.5 bg-brand-500 hover:bg-brand-600 text-white font-semibold rounded-xl shadow-lg transition-all duration-200 hover:scale-105">
                    <i class="bi bi-plus-lg"></i>
                    Add Document
                </a>
            </div>
        </div>

        <!-- Filter & Search Section -->
        <div class="bg-surface-800 rounded-2xl shadow-lg border border-surface-700 p-6 mb-6">
            <div class="flex flex-col lg:flex-row gap-6">

                <!-- Tag Filter -->
                <div class="flex-1">
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Filter by Tags</label>
                    <div class="tag-filter-wrapper relative">
                        <div class="relative">
                            <i class="bi bi-tags absolute left-3 top-1/2 -translate-y-1/2 text-slate-500"></i>
                            <input type="text" id="tagSearchInput"
                                class="w-full pl-10 pr-4 py-3 bg-surface-900 border-2 border-surface-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-brand-500 focus:ring-4 focus:ring-brand-500/20 transition-all duration-200"
                                placeholder="Type to search tags..." autocomplete="off">
                        </div>
                        <div id="tagOptionsDropdown"
                            class="absolute z-50 w-full mt-2 bg-surface-800 rounded-xl shadow-xl border border-surface-700 max-h-48 overflow-y-auto"
                            style="display: none;">
                        </div>
                    </div>
                </div>

                <!-- Reviewed Filter -->
                <div class="flex items-end">
                    <label
                        class="group flex items-center gap-3 px-4 py-3 bg-surface-900 hover:bg-surface-700 rounded-xl cursor-pointer transition-all duration-200 border-2 border-transparent hover:border-brand-500/50">
                        <div class="relative">
                            <input type="checkbox" id="reviewedCheckbox" class="peer sr-only">
                            <div
                                class="w-5 h-5 border-2 border-slate-600 rounded-md peer-checked:border-brand-500 peer-checked:bg-brand-500 transition-all duration-200 flex items-center justify-center">
                            </div>
                            <i
                                class="bi bi-check absolute inset-0 flex items-center justify-center text-white text-lg opacity-0 peer-checked:opacity-100 transition-opacity pointer-events-none"></i>
                        </div>
                        <span class="font-medium text-slate-300 group-hover:text-white transition-colors">Only
                            Reviewed</span>
                    </label>
                </div>
            </div>

            <!-- Selected Tags Display (moved here to prevent layout shift) -->
            <div id="selectedTagsDisplay" class="flex flex-wrap gap-2 mt-4" style="display: none;">
            </div>

            <!-- Search Bar -->
            <div class="mt-6">
                <label class="block text-sm font-semibold text-slate-300 mb-2">Search Documents</label>
                <div class="relative">
                    <i class="bi bi-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                    <input type="text" id="searchInput"
                        class="w-full pl-12 pr-12 py-3.5 bg-surface-900 border-2 border-surface-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-brand-500 focus:ring-4 focus:ring-brand-500/20 transition-all duration-200"
                        placeholder="Search documents by title or content..." autocomplete="off">
                    <div class="loading-spinner absolute right-4 top-1/2 -translate-y-1/2" style="display: none;">
                        <svg class="animate-spin h-5 w-5 text-brand-500" xmlns="http://www.w3.org/2000/svg" fill="none"
                            viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                            </circle>
                            <path class="opacity-75" fill="currentColor"
                                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                            </path>
                        </svg>
                    </div>
                </div>
            </div>
        </div>

        <style>
            /* Tag Filter Dropdown Styles */
            .tag-option {
                padding: 10px 16px;
                cursor: pointer;
                color: #e2e8f0;
                /* slate-200 */
                transition: all 0.2s;
            }

            .tag-option:hover {
                background-color: #334155;
                /* surface-700 */
                color: white;
            }

            .tag-option.selected {
                background-color: #3b82f6;
                /* brand-500 */
                color: white;
            }

            .tag-option-empty {
                padding: 10px 16px;
                color: #94a3b8;
                /* slate-400 */
                font-style: italic;
            }

            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(-4px);
                }

                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
        </style>

        <!-- Results Count -->
        <div id="resultsCount" class="text-sm text-slate-400 mb-4"></div>

        <!-- Documents Grid -->
        <div id="documentsTableContainer">
            <div id="documentsBody" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
            </div>

            <!-- No Results Message -->
            <div id="noResults"
                class="hidden bg-surface-800 rounded-2xl shadow-lg border border-surface-700 p-12 text-center">
                <div class="w-20 h-20 mx-auto mb-4 bg-surface-700 rounded-full flex items-center justify-center">
                    <i class="bi bi-search text-3xl text-slate-500"></i>
                </div>
                <h3 class="text-xl font-semibold text-white mb-2">No documents found</h3>
                <p class="text-slate-400 mb-6">Try a different search term or create a new document.</p>
                <a sec:authorize="isAuthenticated()" th:href="@{/documents/new}"
                    class="inline-flex items-center gap-2 px-5 py-2.5 bg-brand-500 hover:bg-brand-600 text-white font-semibold rounded-xl transition-all duration-200 hover:scale-105">
                    <i class="bi bi-plus-lg"></i>
                    Create New Document
                </a>
            </div>
        </div>

        <!-- Legacy Table (hidden) -->
        <table id="documentsTable" class="hidden">
            <thead>
                <tr>
                    <th>Document ID</th>
                    <th>Title</th>
                    <th>Content Preview</th>
                    <th>Tags</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <div th:replace="layouts :: footer"></div>

    <script th:inline="javascript">
        window.isUserAuthenticated = [[${ isAuthenticated }]];
    </script>
    <script th:src="@{/js/documentSearch.js}"></script>

</body>

</html>
