<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity5">

<head th:replace="layouts :: header">
</head>

<body class="font-sans bg-gradient-to-br from-slate-50 to-slate-100 min-h-screen">

    <nav th:replace="layouts :: navbar"></nav>

    <!-- Main Content -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 pb-24">

        <!-- Page Header -->
        <div class="mb-8">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                <div>
                    <h1
                        class="text-3xl font-bold bg-gradient-to-r from-primary-600 to-accent-purple bg-clip-text text-transparent">
                        Documents
                    </h1>
                    <p class="mt-1 text-slate-500">Manage and organize your documents</p>
                </div>
                <a sec:authorize="isAuthenticated()" th:href="@{/documents/new}"
                    class="inline-flex items-center gap-2 px-5 py-2.5 bg-gradient-to-r from-primary-500 to-primary-600 hover:from-primary-600 hover:to-primary-700 text-white font-semibold rounded-xl shadow-lg shadow-primary-500/25 transition-all duration-200 hover:scale-105 hover:shadow-xl hover:shadow-primary-500/30">
                    <i class="bi bi-plus-lg"></i>
                    Add Document
                </a>
            </div>
        </div>

        <!-- Filter & Search Section -->
        <div
            class="bg-white/70 backdrop-blur-lg rounded-2xl shadow-lg shadow-slate-200/50 border border-white/50 p-6 mb-6">
            <div class="flex flex-col lg:flex-row gap-6">

                <!-- Tag Filter -->
                <div class="flex-1">
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Filter by Tags</label>
                    <div class="tag-filter-wrapper relative">
                        <div class="relative">
                            <i class="bi bi-tags absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                            <input type="text" id="tagSearchInput"
                                class="w-full pl-10 pr-4 py-3 bg-slate-50 border-2 border-slate-200 rounded-xl text-slate-700 placeholder-slate-400 focus:outline-none focus:border-primary-400 focus:ring-4 focus:ring-primary-100 transition-all duration-200"
                                placeholder="Type to search tags..." autocomplete="off">
                        </div>
                        <div id="tagOptionsDropdown"
                            class="absolute z-50 w-full mt-2 bg-white rounded-xl shadow-xl border border-slate-200 max-h-48 overflow-y-auto"
                            style="display: none;">
                            <!-- Tag options will be populated dynamically -->
                        </div>
                        <div id="selectedTagsDisplay" class="flex flex-wrap gap-2 mt-3" style="display: none;">
                            <!-- Selected tags will appear here -->
                        </div>
                    </div>
                </div>

                <!-- Reviewed Filter -->
                <div class="flex items-end">
                    <label
                        class="group flex items-center gap-3 px-4 py-3 bg-slate-50 hover:bg-slate-100 rounded-xl cursor-pointer transition-all duration-200 border-2 border-transparent hover:border-primary-200">
                        <div class="relative">
                            <input type="checkbox" id="reviewedCheckbox" class="peer sr-only">
                            <div
                                class="w-5 h-5 border-2 border-slate-300 rounded-md peer-checked:border-primary-500 peer-checked:bg-primary-500 transition-all duration-200 flex items-center justify-center">
                                <i
                                    class="bi bi-check text-white text-sm opacity-0 peer-checked:opacity-100 transition-opacity"></i>
                            </div>
                        </div>
                        <span class="font-medium text-slate-700 group-hover:text-slate-900 transition-colors">Only
                            Reviewed</span>
                    </label>
                </div>
            </div>

            <!-- Search Bar -->
            <div class="mt-6">
                <label class="block text-sm font-semibold text-slate-700 mb-2">Search Documents</label>
                <div class="relative">
                    <i class="bi bi-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="searchInput"
                        class="w-full pl-12 pr-12 py-3.5 bg-slate-50 border-2 border-slate-200 rounded-xl text-slate-700 placeholder-slate-400 focus:outline-none focus:border-primary-400 focus:ring-4 focus:ring-primary-100 transition-all duration-200"
                        placeholder="Search documents by title or content..." autocomplete="off">
                    <div class="loading-spinner absolute right-4 top-1/2 -translate-y-1/2" style="display: none;">
                        <svg class="animate-spin h-5 w-5 text-primary-500" xmlns="http://www.w3.org/2000/svg"
                            fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                            </circle>
                            <path class="opacity-75" fill="currentColor"
                                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                            </path>
                        </svg>
                    </div>
                </div>
            </div>
        </div>

        <!-- Results Count -->
        <div id="resultsCount" class="text-sm text-slate-500 mb-4"></div>

        <!-- Documents Grid -->
        <div id="documentsTableContainer">
            <div id="documentsBody" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                <!-- Documents will be loaded here as cards -->
            </div>

            <!-- No Results Message -->
            <div id="noResults" class="hidden bg-white rounded-2xl shadow-lg p-12 text-center">
                <div
                    class="w-20 h-20 mx-auto mb-4 bg-gradient-to-br from-slate-100 to-slate-200 rounded-full flex items-center justify-center">
                    <i class="bi bi-search text-3xl text-slate-400"></i>
                </div>
                <h3 class="text-xl font-semibold text-slate-700 mb-2">No documents found</h3>
                <p class="text-slate-500 mb-6">Try a different search term or create a new document.</p>
                <a sec:authorize="isAuthenticated()" th:href="@{/documents/new}"
                    class="inline-flex items-center gap-2 px-5 py-2.5 bg-gradient-to-r from-primary-500 to-primary-600 text-white font-semibold rounded-xl transition-all duration-200 hover:scale-105">
                    <i class="bi bi-plus-lg"></i>
                    Create New Document
                </a>
            </div>
        </div>

        <!-- Legacy Table (hidden, for JS compatibility) -->
        <table id="documentsTable" class="hidden">
            <thead>
                <tr>
                    <th>Document ID</th>
                    <th>Title</th>
                    <th>Content Preview</th>
                    <th>Tags</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <div th:replace="layouts :: footer"></div>

    <script th:inline="javascript">
        // Pass authentication status from server to JavaScript
        window.isUserAuthenticated = [[${ isAuthenticated }]];
    </script>

    <!-- Document Card Template -->
    <template id="documentCardTemplate">
        <div
            class="document-card group bg-white rounded-2xl shadow-lg shadow-slate-200/50 hover:shadow-xl hover:shadow-slate-300/50 border border-slate-100 overflow-hidden transition-all duration-300 hover:-translate-y-1">
            <div class="p-6">
                <!-- Header with ID and Review Status -->
                <div class="flex items-center justify-between mb-3">
                    <span class="doc-id px-2.5 py-1 bg-slate-100 text-slate-600 text-xs font-mono rounded-lg"></span>
                    <span class="doc-review-status"></span>
                </div>

                <!-- Title -->
                <h3
                    class="doc-title text-lg font-semibold text-slate-800 mb-2 line-clamp-2 group-hover:text-primary-600 transition-colors">
                </h3>

                <!-- Content Preview -->
                <p class="doc-content text-slate-500 text-sm line-clamp-3 mb-4"></p>

                <!-- Tags -->
                <div class="doc-tags flex flex-wrap gap-1.5 mb-4"></div>

                <!-- Actions -->
                <div class="flex items-center gap-2 pt-4 border-t border-slate-100">
                    <a
                        class="doc-view flex-1 inline-flex items-center justify-center gap-2 px-4 py-2 bg-slate-100 hover:bg-primary-500 text-slate-700 hover:text-white font-medium rounded-lg transition-all duration-200">
                        <i class="bi bi-eye"></i>
                        View
                    </a>
                    <a
                        class="doc-edit flex-1 inline-flex items-center justify-center gap-2 px-4 py-2 bg-slate-100 hover:bg-amber-500 text-slate-700 hover:text-white font-medium rounded-lg transition-all duration-200">
                        <i class="bi bi-pencil"></i>
                        Edit
                    </a>
                    <button
                        class="doc-delete p-2 bg-slate-100 hover:bg-red-500 text-slate-500 hover:text-white rounded-lg transition-all duration-200">
                        <i class="bi bi-trash"></i>
                    </button>
                </div>
            </div>
        </div>
    </template>

    <script th:src="@{/js/documentSearch.js}"></script>

</body>

</html>
