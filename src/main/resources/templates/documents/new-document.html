<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="layouts :: header"></head>

<body class="font-sans bg-surface-900 min-h-screen">
    <nav th:replace="layouts :: navbar"></nav>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.css">

    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8 pb-24">

        <!-- Page Header -->
        <div class="mb-8">
            <div class="flex items-center gap-4 mb-4">
                <a href="/documents" class="p-2 hover:bg-surface-800 rounded-lg transition-colors">
                    <i class="bi bi-arrow-left text-slate-400 hover:text-white"></i>
                </a>
                <div>
                    <h1 class="text-3xl font-bold text-white"
                        th:text="${document.id != null and document.id != ''} ? 'Edit Document' : 'Create New Document'">
                        Create New Document
                    </h1>
                    <p class="mt-1 text-slate-400">Use markdown formatting to create rich content</p>
                </div>
            </div>
        </div>

        <!-- Form Card -->
        <div class="bg-surface-800 rounded-2xl shadow-xl border border-surface-700 overflow-hidden">
            <form id="documentForm" th:object="${document}" class="divide-y divide-surface-700">
                <input type="hidden" th:field="*{id}" th:if="${document.id != null and document.id != ''}" name="id">

                <!-- Title Section -->
                <div class="p-6">
                    <label class="block text-sm font-semibold text-slate-300 mb-2" for="documentTitle">
                        Document Title <span class="text-red-400">*</span>
                    </label>
                    <input type="text" id="documentTitle"
                        class="w-full px-4 py-3 bg-surface-900 border-2 border-surface-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-brand-500 focus:ring-4 focus:ring-brand-500/20 transition-all duration-200"
                        placeholder="Enter document title" th:field="*{title}" name="title" required>
                </div>

                <!-- Content Editor Section -->
                <div class="p-6">
                    <label class="block text-sm font-semibold text-slate-300 mb-2" for="contentEditor">
                        Content <span class="text-red-400">*</span>
                    </label>
                    <div
                        class="rounded-xl overflow-hidden border-2 border-surface-700 focus-within:border-brand-500 transition-all duration-200">
                        <textarea id="contentEditor" th:field="*{content}" name="content"></textarea>
                    </div>
                    <p class="mt-2 text-sm text-slate-500 flex items-center gap-2">
                        <i class="bi bi-lightbulb text-amber-400"></i>
                        Use the toolbar buttons or markdown syntax.
                    </p>
                </div>

                <!-- Tags Section -->
                <div class="p-6">
                    <label class="block text-sm font-semibold text-slate-300 mb-1" for="tagInput">Tags</label>
                    <p class="text-sm text-slate-500 mb-4">Add tags to organize your document.</p>

                    <div class="flex gap-3 mb-4">
                        <div class="flex-1 relative">
                            <i class="bi bi-tag absolute left-3 top-1/2 -translate-y-1/2 text-slate-500"></i>
                            <input type="text" id="tagInput"
                                class="w-full pl-10 pr-4 py-3 bg-surface-900 border-2 border-surface-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-brand-500 focus:ring-4 focus:ring-brand-500/20 transition-all duration-200"
                                placeholder="Enter a tag (e.g., important, draft)">
                        </div>
                        <button type="button" id="addTagBtn"
                            class="px-5 py-3 bg-emerald-500 hover:bg-emerald-600 text-white font-semibold rounded-xl shadow-lg transition-all duration-200 hover:scale-105">
                            <i class="bi bi-plus-lg mr-1"></i> Add Tag
                        </button>
                    </div>

                    <div id="tagsContainer"
                        class="min-h-[60px] p-4 bg-surface-900 border-2 border-dashed border-surface-700 rounded-xl flex flex-wrap gap-2">
                    </div>
                    <input type="hidden" id="tagsData" name="tags">

                    <script th:inline="javascript">
                        window.initialDocumentTags = /*[[${document.tags}]]*/[];
                    </script>
                </div>

                <!-- Action Buttons -->
                <div class="p-6 bg-surface-900">
                    <div class="flex flex-wrap gap-3">
                        <button
                            class="px-6 py-3 bg-brand-500 hover:bg-brand-600 text-white font-semibold rounded-xl shadow-lg transition-all duration-200 hover:scale-105 flex items-center gap-2"
                            type="submit"
                            th:text="${document.id != null and document.id != ''} ? 'Update Document' : 'Create Document'">
                            <i class="bi bi-check-lg"></i> Create Document
                        </button>
                        <a href="/documents"
                            class="px-6 py-3 bg-surface-700 hover:bg-surface-600 text-slate-300 font-semibold rounded-xl border border-surface-600 transition-all duration-200 flex items-center gap-2">
                            <i class="bi bi-x-lg"></i> Cancel
                        </a>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div th:replace="layouts :: footer"></div>

    <style>
        .EasyMDEContainer .CodeMirror {
            border: 0;
            border-radius: 0;
            background-color: #1e293b;
            color: #e2e8f0;
            min-height: 300px;
        }

        .EasyMDEContainer .CodeMirror-cursor {
            border-left-color: white;
        }

        .EasyMDEContainer .editor-toolbar {
            border: 0;
            border-bottom: 1px solid #334155;
            background-color: #0f172a;
            border-radius: 0;
        }

        .EasyMDEContainer .editor-toolbar button {
            color: #94a3b8;
            border-radius: 0.25rem;
        }

        .EasyMDEContainer .editor-toolbar button:hover {
            background-color: #334155;
            color: white;
        }

        .EasyMDEContainer .editor-toolbar button.active {
            background-color: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
        }

        .EasyMDEContainer .editor-preview {
            background-color: #1e293b;
            color: #e2e8f0;
        }

        .tag-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.375rem 0.75rem;
            background: #3b82f6;
            color: white;
            font-size: 0.875rem;
            font-weight: 500;
            border-radius: 9999px;
            animation: tagFadeIn 0.3s ease;
        }

        .tag-badge:hover {
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.3);
            transform: scale(1.05);
            transition: all 0.2s;
        }

        .tag-remove {
            width: 1.25rem;
            height: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 9999px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tag-remove:hover {
            background-color: rgba(255, 255, 255, 0.4);
            transform: rotate(90deg);
        }

        @keyframes tagFadeIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.js"></script>
    <script th:src="@{/js/documentForm.js}"></script>
</body>

</html>
