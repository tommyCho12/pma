<html lang="en" xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity5">

<head th:fragment="header">
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Google Fonts - Inter for modern typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            200: '#c7d2fe',
                            300: '#a5b4fc',
                            400: '#818cf8',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            800: '#3730a3',
                            900: '#312e81',
                        },
                        accent: {
                            purple: '#764ba2',
                            indigo: '#667eea',
                        }
                    }
                }
            }
        }
    </script>

    <!-- Bootstrap CSS (kept for navbar/footer compatibility) -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
        integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <link rel="stylesheet" th:href="@{/css/formatting.css}">

    <script src="https://cdn.jsdelivr.net/npm/chart.js@2.8.0"></script>

    <link rel="stylesheet" href="//code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
    <link rel="stylesheet" href="/resources/demos/style.css">
    <script src="https://code.jquery.com/jquery-1.12.4.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>

</head>

<nav th:fragment="navbar"
    class="bg-gradient-to-r from-primary-600 via-primary-700 to-accent-purple shadow-lg sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
            <!-- Logo/Brand -->
            <a href="/"
                class="flex items-center gap-2 text-white font-bold text-xl hover:opacity-90 transition-opacity">
                <i class="bi bi-grid-3x3-gap-fill"></i>
                <span>Project IO</span>
            </a>

            <!-- Desktop Navigation -->
            <div class="hidden md:flex items-center gap-1">
                <!-- Main Nav Links -->
                <a th:href="@{/}" th:class="${#request.requestURI == '/'} ? 'nav-link-active' : 'nav-link'"
                    class="px-4 py-2 text-white/90 hover:text-white hover:bg-white/10 rounded-lg font-medium transition-all duration-200">
                    Home
                </a>
                <a th:href="@{/employees}"
                    th:class="${#strings.startsWith(#request.requestURI, '/employees')} ? 'nav-link-active' : 'nav-link'"
                    class="px-4 py-2 text-white/90 hover:text-white hover:bg-white/10 rounded-lg font-medium transition-all duration-200">
                    Employees
                </a>
                <a th:href="@{/projects}"
                    th:class="${#strings.startsWith(#request.requestURI, '/projects') and !#strings.startsWith(#request.requestURI, '/projects/timelines')} ? 'nav-link-active' : 'nav-link'"
                    class="px-4 py-2 text-white/90 hover:text-white hover:bg-white/10 rounded-lg font-medium transition-all duration-200">
                    Projects
                </a>
                <a th:href="@{/projects/timelines}"
                    th:class="${#strings.startsWith(#request.requestURI, '/projects/timelines')} ? 'nav-link-active' : 'nav-link'"
                    class="px-4 py-2 text-white/90 hover:text-white hover:bg-white/10 rounded-lg font-medium transition-all duration-200">
                    Timelines
                </a>
                <a th:href="@{/documents}"
                    th:class="${#strings.startsWith(#request.requestURI, '/documents')} ? 'nav-link-active' : 'nav-link'"
                    class="px-4 py-2 text-white/90 hover:text-white hover:bg-white/10 rounded-lg font-medium transition-all duration-200">
                    Documents
                </a>
                <a th:href="@{/calculator}"
                    th:class="${#strings.startsWith(#request.requestURI, '/calculator')} ? 'nav-link-active' : 'nav-link'"
                    class="px-4 py-2 text-white/90 hover:text-white hover:bg-white/10 rounded-lg font-medium transition-all duration-200">
                    Calculator
                </a>
            </div>

            <!-- Auth Section -->
            <div class="hidden md:flex items-center gap-3">
                <div sec:authorize="isAuthenticated()" class="flex items-center gap-3">
                    <span class="text-white/70 text-sm" sec:authentication="name"></span>
                    <a th:href="@{/logout}"
                        class="px-4 py-2 bg-white/10 hover:bg-white/20 text-white rounded-lg font-medium transition-all duration-200 flex items-center gap-2">
                        <i class="bi bi-box-arrow-right"></i>
                        Logout
                    </a>
                </div>
                <div sec:authorize="!isAuthenticated()">
                    <a th:href="@{/login}"
                        class="px-4 py-2 bg-white text-primary-600 hover:bg-primary-50 rounded-lg font-semibold transition-all duration-200 flex items-center gap-2">
                        <i class="bi bi-box-arrow-in-right"></i>
                        Log In
                    </a>
                </div>
            </div>

            <!-- Mobile menu button -->
            <button type="button" id="mobile-menu-btn"
                onclick="document.getElementById('mobile-menu').classList.toggle('hidden')"
                class="md:hidden p-2 text-white hover:bg-white/10 rounded-lg transition-colors">
                <i class="bi bi-list text-2xl"></i>
            </button>
        </div>
    </div>

    <!-- Mobile Navigation -->
    <div id="mobile-menu" class="hidden md:hidden bg-primary-800/95 backdrop-blur-lg border-t border-white/10">
        <div class="px-4 py-3 space-y-1">
            <a th:href="@{/}"
                th:class="${#request.requestURI == '/'} ? 'block px-4 py-2 bg-white/20 text-white rounded-lg font-medium' : 'block px-4 py-2 text-white/90 hover:bg-white/10 rounded-lg font-medium'">
                Home
            </a>
            <a th:href="@{/employees}"
                th:class="${#strings.startsWith(#request.requestURI, '/employees')} ? 'block px-4 py-2 bg-white/20 text-white rounded-lg font-medium' : 'block px-4 py-2 text-white/90 hover:bg-white/10 rounded-lg font-medium'">
                Employees
            </a>
            <a th:href="@{/projects}"
                th:class="${#strings.startsWith(#request.requestURI, '/projects') and !#strings.startsWith(#request.requestURI, '/projects/timelines')} ? 'block px-4 py-2 bg-white/20 text-white rounded-lg font-medium' : 'block px-4 py-2 text-white/90 hover:bg-white/10 rounded-lg font-medium'">
                Projects
            </a>
            <a th:href="@{/projects/timelines}"
                th:class="${#strings.startsWith(#request.requestURI, '/projects/timelines')} ? 'block px-4 py-2 bg-white/20 text-white rounded-lg font-medium' : 'block px-4 py-2 text-white/90 hover:bg-white/10 rounded-lg font-medium'">
                Timelines
            </a>
            <a th:href="@{/documents}"
                th:class="${#strings.startsWith(#request.requestURI, '/documents')} ? 'block px-4 py-2 bg-white/20 text-white rounded-lg font-medium' : 'block px-4 py-2 text-white/90 hover:bg-white/10 rounded-lg font-medium'">
                Documents
            </a>
            <a th:href="@{/calculator}"
                th:class="${#strings.startsWith(#request.requestURI, '/calculator')} ? 'block px-4 py-2 bg-white/20 text-white rounded-lg font-medium' : 'block px-4 py-2 text-white/90 hover:bg-white/10 rounded-lg font-medium'">
                Calculator
            </a>
            <div class="border-t border-white/10 my-2 pt-2">
                <div sec:authorize="isAuthenticated()">
                    <span class="block px-4 py-1 text-white/60 text-sm" sec:authentication="name"></span>
                    <a th:href="@{/logout}"
                        class="block px-4 py-2 text-white/90 hover:bg-white/10 rounded-lg font-medium">
                        Logout
                    </a>
                </div>
                <a sec:authorize="!isAuthenticated()" th:href="@{/login}"
                    class="block px-4 py-2 bg-white text-primary-600 rounded-lg font-semibold text-center">
                    Log In
                </a>
            </div>
        </div>
    </div>
</nav>

<!-- Navbar active link styles -->
<style th:fragment="navbar-styles">
    .nav-link-active {
        background-color: rgba(255, 255, 255, 0.2);
        color: white;
    }
</style>

<th:block th:fragment="footer">
    <footer
        class="fixed bottom-0 left-0 right-0 h-14 bg-gradient-to-r from-slate-800 via-slate-900 to-slate-800 text-white shadow-lg z-50">
        <div class="max-w-7xl mx-auto h-full px-4 flex items-center justify-between">
            <!-- Version -->
            <div class="text-slate-400 text-sm">
                Version: <span th:text="${version}" class="text-slate-300"></span>
            </div>

            <!-- Chat Toggle Button -->
            <button id="chat-toggle"
                class="px-4 py-2 bg-gradient-to-r from-primary-500 to-accent-purple hover:from-primary-600 hover:to-purple-700 text-white font-medium rounded-lg shadow-lg shadow-primary-500/25 transition-all duration-200 hover:scale-105 flex items-center gap-2">
                <i class="bi bi-chat-dots"></i>
                Chat
            </button>
        </div>

        <!-- Chat Window -->
        <div id="chatbot-window"
            class="fixed bottom-16 right-4 w-80 h-[420px] bg-white rounded-2xl shadow-2xl border border-slate-200 overflow-hidden z-[1100] hidden flex-col">

            <!-- Chat header -->
            <div
                class="bg-gradient-to-r from-primary-500 to-accent-purple text-white px-4 py-3 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <i class="bi bi-robot text-lg"></i>
                    <span class="font-semibold">AI Assistant</span>
                </div>
                <button id="chat-close"
                    class="w-7 h-7 flex items-center justify-center bg-white/20 hover:bg-white/30 rounded-lg transition-colors">
                    <i class="bi bi-x-lg text-sm"></i>
                </button>
            </div>

            <!-- Chat content -->
            <div id="chat-messages" class="flex-1 p-4 overflow-y-auto text-sm text-slate-700 space-y-3"></div>

            <!-- Chat input -->
            <div class="p-3 border-t border-slate-200 bg-slate-50">
                <div class="flex gap-2">
                    <input type="text" id="chat-input"
                        class="flex-1 px-3 py-2 bg-white border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent"
                        placeholder="Type your message...">
                    <button id="send-btn"
                        class="px-4 py-2 bg-gradient-to-r from-primary-500 to-primary-600 hover:from-primary-600 hover:to-primary-700 text-white font-medium rounded-lg transition-all duration-200">
                        <i class="bi bi-send"></i>
                    </button>
                </div>
            </div>
        </div>

        <script th:src="@{/js/chatbot.js}"></script>
    </footer>
</th:block>
